# XcodeGen project for macOS/iOS app shell.
# Generate on a Mac: brew install xcodegen && xcodegen generate
# Cloud Linux agents do not use this file — they run SPM tests + DevHarness.

name: Loci
options:
  bundleIdPrefix: app.loci
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Loci:
    path: .
targets:
  Loci:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: Loci
        product: LociCore
      - package: Loci
        product: LociVault
      - package: Loci
        product: LociMarkdown
      - package: Loci
        product: LociIndex
      - package: Loci
        product: LociDesignSystem
    entitlements:
      path: App/Resources/Loci.entitlements
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Loci
        UILaunchScreen: {}
        NSUbiquitousContainers:
          iCloud.app.loci.Loci:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Loci
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loci.Loci
        CODE_SIGN_ENTITLEMENTS: App/Resources/Loci.entitlements
