# XcodeGen project for macOS/iOS app shell.
# Generate on a Mac: brew install xcodegen && xcodegen generate
# Cloud Linux agents do not use this file — they run SPM tests + DevHarness.
#
# PR26: Share extension + Widget + (sources for) menu bar capture are stub targets.
# They write `.loci/inbox/` staging files; the main app drains on foreground.
# PR32: Safari App Extension stub (macOS) — same inbox path.

name: Loci
options:
  bundleIdPrefix: app.loci
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.32.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Loci:
    path: .
targets:
  Loci:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - Platform/iOS/ShareExtension/**
          - Platform/iOS/Widget/**
          - Platform/macOS/SafariExtension/**
    dependencies:
      - package: Loci
        product: LociCore
      - package: Loci
        product: LociVault
      - package: Loci
        product: LociMarkdown
      - package: Loci
        product: LociIndex
      - package: Loci
        product: LociDesignSystem
      - target: LociShareExtension
        embed: true
        codeSign: true
        platformFilter: iOS
      - target: LociWidgets
        embed: true
        codeSign: true
        platformFilter: iOS
      - target: LociSafariExtension
        embed: true
        codeSign: true
        platformFilter: macOS
    entitlements:
      path: App/Resources/Loci.entitlements
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Loci
        UILaunchScreen: {}
        NSUbiquitousContainers:
          iCloud.app.loci.Loci:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Loci
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loci.Loci
        CODE_SIGN_ENTITLEMENTS: App/Resources/Loci.entitlements

  # PR26 — iOS Share extension stub (enqueue .loci/inbox/*.json)
  LociShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Platform/iOS/ShareExtension
    dependencies:
      - package: Loci
        product: LociCore
      - package: Loci
        product: LociVault
    info:
      path: App/Platform/iOS/ShareExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loci.Loci.ShareExtension
        SKIP_INSTALL: true

  # PR26 — Home Screen widget stub (Open today / Quick add)
  LociWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Platform/iOS/Widget
    dependencies:
      - package: Loci
        product: LociCore
    info:
      path: App/Platform/iOS/Widget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loci.Loci.Widgets
        SKIP_INSTALL: true

  # PR32 — macOS Safari App Extension stub (enqueue .loci/inbox/*.json)
  LociSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: App/Platform/macOS/SafariExtension
    dependencies:
      - package: Loci
        product: LociCore
      - package: Loci
        product: LociVault
      - sdk: SafariServices.framework
    info:
      path: App/Platform/macOS/SafariExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loci.Loci.SafariExtension
        SKIP_INSTALL: true
